<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Calculator - Sci-Fi Precision</title>
  
  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  
  <meta name="theme-color" content="#00f3ff">
  <meta name="description" content="A cinematic calculator with voice input, expression parsing, and sci-fi visuals">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cosmic-bg">
    <div class="stars"></div>
    <div class="twinkling"></div>
  </div>
  
  <main class="calculator-container">
    <!-- Header -->
    <header class="calculator-header">
      <div class="brand">
        <span class="brand-name">NEXUS</span>
        <span class="brand-model">CALC-07</span>
      </div>
      <div class="header-controls">
        <button id="historyToggle" class="icon-btn" title="History">
          <img src="icons/history.svg" alt="History" width="20" height="20">
        </button>
        <button id="settingsToggle" class="icon-btn" title="Settings">
          <img src="icons/settings.svg" alt="Settings" width="20" height="20">
        </button>
      </div>
    </header>

    <!-- Main Calculator Card -->
    <div class="calculator-card">
      <!-- Display Section -->
      <div class="display-section">
        <div class="expression-display" id="expression">0</div>
        <div class="result-display" id="result">0</div>
        <div class="memory-indicator" id="memoryIndicator"></div>
      </div>

      <!-- History Panel (collapsible) -->
      <div class="history-panel hidden" id="historyPanel">
        <div class="history-header">
          <h3>History</h3>
          <button id="clearHistory" class="clear-history">Clear</button>
        </div>
        <div class="history-list" id="historyList">
          <!-- History items go here -->
        </div>
      </div>

      <!-- Constants Bar -->
      <div class="constants-bar">
        <button class="constant-btn" data-constant="π">π</button>
        <button class="constant-btn" data-constant="e">e</button>
        <button class="constant-btn" data-constant="φ">φ</button>
        <button class="constant-btn" data-constant="c">c</button>
        <button class="constant-btn" data-constant="h">h</button>
      </div>

      <!-- Memory Controls -->
      <div class="memory-bar">
        <button class="memory-btn" data-memory="mc">MC</button>
        <button class="memory-btn" data-memory="mr">MR</button>
        <button class="memory-btn" data-memory="m+">M+</button>
        <button class="memory-btn" data-memory="m-">M-</button>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <!-- Row 1 -->
        <button class="calc-btn function" data-action="clear">C</button>
        <button class="calc-btn function" data-action="backspace">
          <img src="icons/backspace.svg" alt="⌫" width="18" height="18">
        </button>
        <button class="calc-btn function" data-action="percent">%</button>
        <button class="calc-btn operator" data-operator="/">÷</button>
        
        <!-- Row 2 -->
        <button class="calc-btn number" data-number="7">7</button>
        <button class="calc-btn number" data-number="8">8</button>
        <button class="calc-btn number" data-number="9">9</button>
        <button class="calc-btn operator" data-operator="*">×</button>
        
        <!-- Row 3 -->
        <button class="calc-btn number" data-number="4">4</button>
        <button class="calc-btn number" data-number="5">5</button>
        <button class="calc-btn number" data-number="6">6</button>
        <button class="calc-btn operator" data-operator="-">−</button>
        
        <!-- Row 4 -->
        <button class="calc-btn number" data-number="1">1</button>
        <button class="calc-btn number" data-number="2">2</button>
        <button class="calc-btn number" data-number="3">3</button>
        <button class="calc-btn operator" data-operator="+">+</button>
        
        <!-- Row 5 -->
        <button class="calc-btn number zero" data-number="0" colspan="2">0</button>
        <button class="calc-btn number" data-number=".">.</button>
        <button class="calc-btn equals" data-action="calculate">
          <img src="icons/equals.svg" alt="=" width="20" height="20">
        </button>
      </div>

      <!-- Voice Input Bar -->
      <div class="voice-bar">
        <button id="voiceBtn" class="voice-btn">
          <img src="icons/mic.svg" id="micIcon" alt="Voice input" width="20" height="20">
          <span id="voiceText">Tap to speak</span>
        </button>
      </div>
    </div>

    <!-- Unit Converter Panel (hidden by default) -->
    <div class="converter-panel hidden" id="converterPanel">
      <div class="converter-header">
        <h3>Unit Converter</h3>
        <button id="closeConverter" class="close-btn">✕</button>
      </div>
      <div class="converter-tabs">
        <button class="converter-tab active" data-converter="length">Length</button>
        <button class="converter-tab" data-converter="weight">Weight</button>
        <button class="converter-tab" data-converter="temperature">Temp</button>
      </div>
      <div class="converter-content" id="converterContent">
        <!-- Converter UI will be populated by JS -->
      </div>
    </div>

    <!-- Install PWA Prompt -->
    <div id="installContainer" class="install-container hidden">
      <button id="installBtn" class="install-btn">
        <span>📲</span> Install Nexus Calculator
      </button>
    </div>
  </main>

  <!-- External JavaScript -->
  <script src="script.js"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('ServiceWorker registered'))
          .catch(err => console.log('ServiceWorker registration failed'));
      });
    }
  </script>
</body>
</html>
